name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Lakehouse Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            01_Bronze_Ingestion.py \
            02_Silver_Transformation.py \
            03_Gold_Aggregations.py \
            04_Data_Quality.py \
            05_Optimization.py \
            06_Orchestration.py \
            07_Monitoring.py \
            08_Business_Insights.py

      - name: Verify required project files
        run: |
          test -f README.md
          test -f requirements.txt
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
