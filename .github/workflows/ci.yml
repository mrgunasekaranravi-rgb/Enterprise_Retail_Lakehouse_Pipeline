name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Databricks Notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          import pathlib

          notebooks = sorted(pathlib.Path(".").glob("*.ipynb"))

          if not notebooks:
              raise SystemExit("No notebooks found")

          for notebook in notebooks:
              with notebook.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"Validated: {notebook}")

          print(f"Successfully validated {len(notebooks)} notebooks.")
          PY

      - name: Verify required project files
        run: |
          test -f README.md
          test -f requirements.txt
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
